name: Deploy MySpace

# Triggers:
#   1. push to main  -> automatic deploy
#   2. manual run from the GitHub Actions UI
#
# NOTE: All script bodies below are intentionally ASCII-only.
#       The self-hosted runner on Windows reads the generated .ps1 temp file
#       using the system ANSI code page (GBK on this host), which corrupts
#       non-ASCII characters and breaks PowerShell parsing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-myself-space
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  LANG: en_US.UTF-8

jobs:
  deploy:
    # Self-hosted runner installed at C:\actions-runner-zbw on the Windows server
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Fetch latest code
        shell: powershell
        working-directory: C:\deploy-zhengbao
        run: |
          # The deploy directory is a git working tree pointing at origin/main.
          # fetch + reset --hard leaves ignored files (.env, uploads/, node_modules)
          # untouched, unlike git pull which can conflict on them.
          $git = "C:\Program Files\Git\bin\git.exe"
          & $git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          & $git reset --hard origin/main
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }
          & $git log -1 --oneline

      - name: Install dependencies (only when package-lock.json changed)
        shell: powershell
        working-directory: C:\deploy-zhengbao
        run: |
          $hashFile = "C:\actions-runner-zbw\.cache\myself-space-deps-hash.txt"
          $newHash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
          $oldHash = ""
          if (Test-Path $hashFile) { $oldHash = (Get-Content $hashFile -Raw).Trim() }

          if ($newHash -eq $oldHash) {
            Write-Host "package-lock.json unchanged - skipping dependency install."
            exit 0
          }

          Write-Host "Dependencies changed, running npm ci ..."
          & "C:\Program Files\nodejs\npm.cmd" ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }

          New-Item -ItemType Directory -Force -Path (Split-Path $hashFile) | Out-Null
          Set-Content -Path $hashFile -Value $newHash -Encoding ASCII

      - name: Install and verify WanChuang runtime
        shell: powershell
        working-directory: C:\deploy-zhengbao
        run: |
          & "C:\Program Files\nodejs\npm.cmd" run setup:wanchuang
          if ($LASTEXITCODE -ne 0) {
            throw "WanChuang runtime provisioning failed; existing service has not been restarted"
          }

      - name: Build (frontend + server bundle)
        shell: powershell
        working-directory: C:\deploy-zhengbao
        run: |
          # npm run build = vite build && esbuild server.ts -> server/server.cjs
          & "C:\Program Files\nodejs\npm.cmd" run build
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Restart service
        shell: powershell
        run: |
          # The app is hosted by scheduled task Startup_zhengbao-portfolio
          # (runs as SYSTEM) and listens on 3002; the LZGO gateway on 443
          # reverse-proxies zhengbao.work to it via PROXY_MAP.
          #
          # Restart strategy: stop the listener, then invoke the scheduled task
          # and WAIT for the task to actually finish and the port to come back.
          # schtasks /run returns immediately, so polling here is essential -
          # a fixed Start-Sleep is not enough and led to a 502 on this host.
          $port = 3002
          $envFile = "C:\deploy-zhengbao\.env"
          if (Test-Path $envFile) {
            $line = Select-String -Path $envFile -Pattern '^\s*PORT\s*=\s*(\d+)' | Select-Object -First 1
            if ($line) { $port = [int]$line.Matches[0].Groups[1].Value }
          }
          Write-Host "Service port: $port"

          # 1) stop whatever currently listens on the app port
          $conns = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
          foreach ($c in $conns) {
            $targetPid = $c.OwningProcess
            if ($targetPid -and $targetPid -ne 0) {
              Write-Host "Stopping PID $targetPid on port $port"
              Stop-Process -Id $targetPid -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 3

          # 2) end any leftover task instance so /run is not ignored
          & schtasks /end /tn "Startup_zhengbao-portfolio" 2>$null | Out-Null
          Start-Sleep -Seconds 2

          # 3) start and wait for the port to come back, retrying the task
          #    launch if it has not appeared after the first attempt
          $listening = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Launching scheduled task (attempt $attempt) ..."
            & schtasks /run /tn "Startup_zhengbao-portfolio" | Out-Null
            for ($i = 1; $i -le 12; $i++) {
              Start-Sleep -Seconds 2
              $c = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
              if ($c) {
                Write-Host "Port $port is listening (PID=$($c[0].OwningProcess))"
                $listening = $true
                break
              }
            }
            if ($listening) { break }
            Write-Host "Port $port still down after attempt $attempt"
          }

          if (-not $listening) { throw "service did not come up on port $port" }

      - name: Health check (direct)
        shell: powershell
        run: |
          $port = 3002
          $envFile = "C:\deploy-zhengbao\.env"
          if (Test-Path $envFile) {
            $line = Select-String -Path $envFile -Pattern '^\s*PORT\s*=\s*(\d+)' | Select-Object -First 1
            if ($line) { $port = [int]$line.Matches[0].Groups[1].Value }
          }
          Write-Host "Health check port: $port"

          $ok = $false
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -TimeoutSec 5 -UseBasicParsing
              if ($r.StatusCode -eq 200) {
                Write-Host "Direct health check OK (attempt $i): $($r.Content)"
                $ok = $true
                break
              }
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 3
          }

          if (-not $ok) { throw "health check failed on port $port" }

      - name: Health check (through gateway)
        shell: powershell
        run: |
          # Verify the LZGO gateway still proxies zhengbao.work to this app.
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "https://zhengbao.work/health" -TimeoutSec 10 -UseBasicParsing
              if ($r.StatusCode -eq 200) {
                Write-Host "Gateway health check OK (attempt $i): $($r.Content)"
                $ok = $true
                break
              }
            } catch {
              Write-Host "Gateway attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 3
          }
          # Gateway check is informational: TLS/network hiccups should not fail a deploy.
          if (-not $ok) { Write-Warning "Gateway health check did not pass - verify manually." }

      - name: Deploy summary
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Deploy summary ==="
          $head = & "C:\Program Files\Git\bin\git.exe" -C C:\deploy-zhengbao log -1 --oneline
          Write-Host "Commit: $head"
          Write-Host ""
          Write-Host "Listening ports:"
          foreach ($port in @(3002, 443)) {
            $conns = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if ($conns) {
              $pids = ($conns | Select-Object -ExpandProperty OwningProcess -Unique) -join ','
              Write-Host "  port $port : LISTENING (PID=$pids)"
            } else {
              Write-Host "  port $port : not listening"
            }
          }
