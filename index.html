    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05090b" />
    <script>
      if (!location.pathname.startsWith("/admin")) document.documentElement.classList.add("portfolio-document");
    </script>
    <style>
      html.portfolio-document { background: #05090b; color-scheme: dark; }
      html.portfolio-document body,
      html.portfolio-document #root { min-height: 100%; margin: 0; background: #05090b; }

      /* 缓冲加载页。写在 HTML 里而不是 React 里：JS 包还没下载完时它就已经在了，
         访客从第一帧起看到的就是加载页，而不是一块黑屏。由 App.tsx 的 dismissBootLoader 收起。 */
      #boot-loader { display: none; }
      /* 手写题扉：真实笔顺 SVG、错落构图，首屏就绪后完成收笔。 */
      html.portfolio-document #boot-loader { position: fixed; inset: 0; z-index: 2100; display: grid; place-items: center; background: var(--portfolio-bg, #05090b); color: var(--portfolio-text, #eef4f2); overflow: hidden; font-family: "Microsoft YaHei", system-ui, sans-serif; transition: opacity 420ms ease, visibility 0s linear 420ms; }
      #boot-loader[data-leaving] { opacity: 0; visibility: hidden; }
      .boot-loader__inner { width: min(208px, 58vw); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
      .boot-loader__lettering { display: block; width: 100%; height: auto; overflow: visible; color: var(--portfolio-text, #eef4f2); }
      .boot-loader__flourish { fill: none; stroke: var(--portfolio-accent, #62f5ce); stroke-width: 3; stroke-linecap: round; opacity: var(--ink-finish, 0); }
      .boot-loader__status { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--portfolio-muted, #899694); font-size: 11px; letter-spacing: .12em; white-space: nowrap; }
      .boot-loader__track { position: relative; overflow: hidden; width: 96px; height: 1px; background: var(--portfolio-line, rgba(139, 165, 170, 0.13)); }
      .boot-loader__track::after { content: ""; position: absolute; inset: 0; background: var(--portfolio-accent, #62f5ce); animation: bootPageSweep 2s ease-in-out infinite; }
      @keyframes bootPageSweep { from { transform: translateX(-105%); } to { transform: translateX(105%); } }
      @media (max-width: 480px) { .boot-loader__inner { width: min(176px, 58vw); gap: 16px; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader *, #boot-loader *::after { animation: none !important; }
        html.portfolio-document #boot-loader { transition: none; }
      }
    </style>
    <title>一“页”知我 · Me on One Page</title>

    <script>
      (() => {
        const loader = document.getElementById('boot-loader');
        if (!document.documentElement.classList.contains('portfolio-document')) return;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const strokes = Array.from(loader.querySelectorAll('.boot-ink'));
        const lengths = strokes.map(path => path.getTotalLength() + 110);
        const total = lengths.reduce((sum, length) => sum + length, 0);
        let progress = 0, frame = 0, completing = false;
        const started = performance.now();
        function paint(value) {
          progress = value;
          let remaining = value * total;
          strokes.forEach((path, index) => {
            const portion = Math.max(0, Math.min(1, remaining / lengths[index]));
            path.style.strokeDasharray = '1000';
            path.style.strokeDashoffset = String(1000 * (1 - portion));
            path.style.opacity = portion > 0 ? '1' : '0';
            remaining -= lengths[index];
          });
          loader.style.setProperty('--ink-finish', String(Math.max(0, (value - .94) / .06)));
        }
        function waiting(now) {
          if (!loader.isConnected || completing) return;
          // Reserve the final strokes for actual readiness; this is not a fake percentage.
          paint(reduced.matches ? 1 : .88 * (1 - Math.exp(-(now - started) / 2100)));
          if (!reduced.matches) frame = requestAnimationFrame(waiting);
        }
        function finish() {
          if (completing) return;
          completing = true;
          cancelAnimationFrame(frame);
          const from = progress, finishStart = performance.now();
          const duration = reduced.matches ? 0 : Math.max(280, (1 - from) * 1400);
          function settle(now) {
            if (!loader.isConnected) return;
            const t = duration ? Math.min(1, (now - finishStart) / duration) : 1;
            paint(from + (1 - from) * t);
            if (t < 1) { frame = requestAnimationFrame(settle); return; }
            loader.dataset.leaving = '';
            setTimeout(() => loader.remove(), reduced.matches ? 0 : 440);
          }
          frame = requestAnimationFrame(settle);
        }
        loader.addEventListener('boot:complete', finish, { once: true });
        loader.dataset.strokeController = 'ready';
        paint(reduced.matches ? 1 : 0);
        frame = requestAnimationFrame(waiting);
        reduced.addEventListener('change', () => { if (reduced.matches) { cancelAnimationFrame(frame); paint(1); if (completing) loader.remove(); } });
      })();
    </script>
