<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05090b" />
    <script>
      if (!location.pathname.startsWith("/admin")) document.documentElement.classList.add("portfolio-document");
    </script>
    <style>
      html.portfolio-document { background: #05090b; color-scheme: dark; }
      html.portfolio-document body,
      html.portfolio-document #root { min-height: 100%; margin: 0; background: #05090b; }

      /* 缓冲加载页。写在 HTML 里而不是 React 里：JS 包还没下载完时它就已经在了，
         访客从第一帧起看到的就是加载页，而不是一块黑屏。由 App.tsx 的 dismissBootLoader 收起。 */
      #boot-loader { display: none; }
      html.portfolio-document #boot-loader {position:fixed;inset:0;z-index:2100;display:grid;place-items:center;background:#05090b;color:#eef4f2;overflow:hidden;font-family:"Microsoft YaHei",system-ui,sans-serif;}
      .boot-loader__inner {display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;}
      .boot-loader__bars {height:36px;display:flex;align-items:flex-end;gap:6px;}
      .boot-loader__bars i {display:block;width:5px;border-radius:4px;background:#62f5ce;box-shadow:0 0 12px #62f5ce40;transform-origin:50% 100%;animation:bootSignal 850ms ease-in-out infinite alternate;}
      .boot-loader__bars i:nth-child(1) {height:18px;}
      .boot-loader__bars i:nth-child(2) {height:34px;animation-delay:-400ms;animation-duration:720ms;}
      .boot-loader__bars i:nth-child(3) {height:25px;background:#cbd4d2;animation-delay:-170ms;animation-duration:980ms;}
      .boot-loader__brand {font:11px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.3em;color:#8b9996;}
      .boot-loader__status {font-size:12px;color:#899694;}
      @keyframes bootSignal {from{transform:scaleY(.35)}to{transform:scaleY(1)}}
      @media(prefers-reduced-motion:reduce) {.boot-loader__bars i{animation:none;}}
    </style>
    <title>一“页”知我 · Me on One Page</title>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-loader__inner">
        <div class="boot-loader__bars" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="boot-loader__brand">MY SPACE</div>
        <span class="boot-loader__status">正在加载，请稍候…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
